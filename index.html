  function b64(s){var bin=atob(s),a=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a;}
  var f=document.getElementById("f"),pw=document.getElementById("pw"),err=document.getElementById("err");

    err.textContent="";

      var enc=new TextEncoder();
      var km=await crypto.subtle.importKey("raw", enc.encode(pw.value), "PBKDF2", false, ["deriveKey"]);
